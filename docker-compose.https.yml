services:
  caddy:
    image: caddy:2-alpine
    container_name: emotion-music-ai-caddy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
      api_gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
